<script type="text/plain" id="embedded-css">*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
@font-face{font-family:NotoCJK;src:url(fonts/NotoSansCJKsc-Regular.otf);font-weight:400}
@font-face{font-family:NotoCJK;src:url(fonts/NotoSansCJKsc-Bold.otf);font-weight:700}
@font-face{font-family:DJM;src:url(fonts/DejaVuSansMono.ttf)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:NotoCJK,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:#eee2ca}
#stage{--tb:32px;position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0b0b0e;overflow:hidden}
.scr{position:absolute;inset:0;background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hs{position:absolute;cursor:pointer}
.debug .hs{outline:3px solid rgba(255,60,60,.9);background:rgba(255,60,60,.12)}
.debug .hs.dc{outline-color:rgba(60,220,60,.9);background:rgba(60,220,60,.12)}
.btn{position:absolute;padding:14px 30px;font-size:30px;color:#e8e2d6;background:rgba(20,20,26,.72);border:2px solid rgba(200,190,170,.55);border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:2px}
.btn:hover{background:rgba(70,40,40,.85);border-color:#c9a27a}
.btn.sel{background:rgba(110,30,30,.9);border-color:#e0b080}
.hud{position:absolute;pointer-events:none;inset:0}
.hud>*{pointer-events:auto}
.tabs{position:absolute;left:30px;bottom:30px;display:flex;gap:12px}
.tabs .btn{position:static;font-size:26px;padding:10px 22px}
.pbar{position:absolute;left:560px;top:24px;width:800px;height:26px;border:2px solid rgba(200,190,170,.6);background:rgba(10,10,14,.7);border-radius:13px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6a1c1c,#b33a3a);transition:width .6s}
.ptxt{position:absolute;left:560px;top:56px;width:800px;text-align:center;font-size:20px;color:#c8bfae;pointer-events:none}
.cam{position:absolute;right:30px;bottom:30px;width:150px;height:150px;cursor:pointer;filter:drop-shadow(0 4px 10px #000);transition:transform .15s}
.cam:active{transform:scale(.9)}
.badge{position:absolute;min-width:34px;height:34px;border-radius:17px;background:#b33a3a;color:#fff;font-size:22px;text-align:center;line-height:34px;padding:0 8px}
@keyframes bl{50%{opacity:.2}}
@keyframes fo{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:fl .45s forwards}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.gflash{position:absolute;inset:0;background:radial-gradient(circle,#8fb7d8,#0b1a2a);pointer-events:none;animation:fl .55s forwards}
.glass-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at center,rgba(6,24,40,.16) 40%,rgba(2,6,12,.5) 100%);backdrop-filter:contrast(1.08) saturate(.86) brightness(.9)}
.glass-fx .fog{position:absolute;left:-4%;top:-4%;width:108%;height:108%;background:url(assets/6_标题与界面/G_fog.png) center/100% 100%;animation:fogd 14s ease-in-out infinite alternate}
.glass-fx .fog.b{background-image:url(assets/6_标题与界面/G_fog.png);transform:scaleX(-1) scaleY(-1);opacity:.3;animation:fogd2 19s ease-in-out infinite alternate}
.glass-fx .vein{position:absolute;inset:0;background:url(assets/6_标题与界面/G_veins2.png) center/100% 100%;animation:vp 3.6s ease-in-out infinite}
@keyframes fogd{0%{transform:translate(-1.2%,.8%) scale(1)}100%{transform:translate(1.4%,-1%) scale(1.04)}}
@keyframes fogd2{0%{transform:scaleX(-1) scaleY(-1) translate(1.5%,0) scale(1.03)}100%{transform:scaleX(-1) scaleY(-1) translate(-1.5%,1%) scale(1)}}
@keyframes vp{0%,100%{opacity:.72;transform:scale(1)}45%{opacity:1;transform:scale(1.012)}}

  function investigationTexts(q) {
    if (q._investigationTexts) return q._investigationTexts;
    var entries = new Map();
    function add(id, view, text, label, source) {
      var lines = textLines(text);
      if (!lines.length) return;
      var key = investigationKey(id, view);
      if (!entries.has(key)) entries.set(key, { key: key, id: id, view: view, lines: lines, rawFirst: text[0], label: label, rooms: new Set() });
      entries.get(key).rooms.add(source.label);
    }
    function visit(list, view, source, visited) {
      list.forEach(function (h) {
        if (h.vis !== 'both' && h.vis !== view) return;
        var target = h.to || (typeof h.closeup === 'string' ? h.closeup :
          h.closeup && (h.closeup[view] || h.closeup.N || h.closeup.G));
        if (!target) {
          var text = h.direct ? q.direct[h.direct] : h.text;
          if (text) add(h.direct || h.id, view, text[view], h.name, source);
          return;
        }
        var closeup = q.closeups[target];
        if (!closeup || !closeup.img[view] || visited.has(target)) return;
        visited.add(target);
        if (closeup.text) add(target, view, closeup.text[view], h.smash ? '墙内遗体' : h.name, source);
        visit(closeup.hotspots, view, source, visited);
      });
    }
    q.rooms.forEach(function (source) {
      ['N', 'G'].forEach(function (view) { visit(source.hotspots, view, source, new Set()); });
    });
    q.auto.forEach(function (memory) {
      var source = q.rooms.find(function (r) { return r.id === memory.room; });
      if (source) add(memory.id, memory.view, memory.lines, memory.name, source);
    });
    q._investigationTexts = entries;
    return entries;
  }
  function investigationKey(id, view) { return 'text|' + id + '|' + view; }
  function textLines(lines) {
    return (lines || []).map(dialogueText).filter(function (line) { return line.trim(); });
  }
  function collectedTexts(q, log, seen) {
    var catalog = investigationTexts(q), collected = new Map();
    log.forEach(function (entry) {
      if (!Array.isArray(entry.lines) || !entry.room) return;
      var lines = JSON.stringify(textLines(entry.lines));
      function matches(item) {
        return item && Array.from(item.rooms).some(function (name) {
          return entry.room === name || entry.room === previousRoomName[name];
        }) && lines === JSON.stringify(item.lines);
      }
      var item = entry.key ? catalog.get(entry.key) : null;
      if (!entry.key) {
        var candidates = Array.from(catalog.values()).filter(matches);
        if (candidates.length > 1) candidates = candidates.filter(function (candidate) {
          return seen[candidate.key] || seen[q.id + '|' + candidate.view + '|' + candidate.rawFirst.slice(0, 24)];
        });
        if (candidates.length === 1) item = candidates[0];
      }
      if (matches(item)) collected.set(item.key, item);
    });
    return collected;
  }
  /* 同一物件、文字逐字相同的普通/眼镜两个视角，只算一条 */
  function sameTextKey(item) { return item.id + '|' + item.lines.join('\n'); }

      var playback = sample.play(); if (playback && playback.catch) playback.catch(function () {});
    }
    function leave(save, target) {
      if (sample) sample.pause();
      if (save) {
        SET = draft; saveSet();
        var promise;
        if (SET.full && !document.fullscreenElement && document.documentElement.requestFullscreen) promise = document.documentElement.requestFullscreen();
        else if (!SET.full && document.fullscreenElement && document.exitFullscreen) promise = document.exitFullscreen();
        if (promise && promise.catch) promise.catch(function () {});
      } else { setMusicVolume(); applyBright(SET.bright); }
      target();
    }
    s.appendChild(uibtn('UI_返回', function () { leave(false, backFn); }, [60, 58])); s.appendChild(tx('设置', 270, 40, 400, 90, 'st1'));
    s.appendChild(el('div', 'sline'));
    var left = el('div', 'spl'), right = el('div', 'spr'); s.appendChild(left); s.appendChild(right);
    function draw() {
      left.innerHTML = ''; ['声音', '画面', '阅读'].forEach(function (n, i) { var d = el('div', 'si' + (i === tab ? ' on' : ''), '<b>0' + (i + 1) + '</b>' + n + (i === tab ? '<i>›</i>' : '')); d.onclick = function () { tab = i; draw(); }; left.appendChild(d); });
      right.innerHTML = '<h2>' + ['声音', '画面', '阅读'][tab] + '</h2>';
      if (tab === 0) [['master', '总音量'], ['bgm', '背景音乐'], ['sfx', '音效']].forEach(function (c) {
        var r = el('div', 'srow', '<span>' + c[1] + '</span>'); var sl = el('input'); sl.type = 'range'; sl.min = 0; sl.max = 100; sl.value = draft[c[0]]; sl.setAttribute('aria-label', c[1]); var v = el('em', '', draft[c[0]] + '%'); sl.oninput = function () { draft[c[0]] = +sl.value; v.textContent = sl.value + '%'; preview(c[0] === 'sfx'); }; r.appendChild(sl); r.appendChild(v); right.appendChild(r);
      });
      function seg(label, key, opts, hint) {
        var r = el('div', 'srow' + (hint ? ' tall' : ''));
        r.appendChild(el('div', 'slab', label + (hint ? '<small>' + hint + '</small>' : '')));
        var g = el('div', 'seg');
        opts.forEach(function (o) { var x = el('div', 'sb' + (draft[key] === o[1] ? ' on' : ''), o[0]); x.onclick = function () { draft[key] = o[1]; draw(); }; g.appendChild(x); });
        r.appendChild(g); right.appendChild(r);
      }
      function brightRow() {
        var r = el('div', 'srow tall');
        r.appendChild(el('div', 'slab', '画面亮度<small>恐怖场景偏暗时可以调亮；屏幕太亮时可以调暗。</small>'));
        var w = el('div', 'sbright'), sl = el('input'); sl.type = 'range'; sl.min = 50; sl.max = 150; sl.step = 5; sl.value = draft.bright; sl.setAttribute('aria-label', '画面亮度');
        var v = el('em', '', draft.bright + '%'); sl.oninput = function () { draft.bright = +sl.value; v.textContent = sl.value + '%'; applyBright(draft.bright); };
        w.appendChild(sl); w.appendChild(v); r.appendChild(w); right.appendChild(r);
      }
      if (tab === 1) {
        seg('显示模式', 'full', [['窗口', false], ['全屏', true]], '全屏会隐藏浏览器栏。iPhone 和 iPad 不支持，请用“添加到主屏幕”打开。');
        brightRow();
        seg('界面按钮大小', 'ui', [['小', 0.85], ['中', 1], ['大', 1.2]], '手机和 iPad 上觉得按钮太小，可以放大；电脑上无需调整。');
        seg('减弱闪烁与抖动', 'calm', [['关', false], ['开', true]], '减弱砸墙抖动、拍照白闪、故障闪烁和戴摘眼镜的动画。');
      }
      if (tab === 2) { seg('调查文本字号', 'fs', [['小', 28], ['中', 32], ['大', 38]]); right.appendChild(el('div', 'prev', '<small>阅读预览</small><p class="prev-fs" style="font-size:' + draft.fs + 'px">衣柜右门下方有一块暗色污迹。</p>')); }
    }
    draw();
    if (backFn === game) s.appendChild(metalButton('保存并返回标题页', function () { leave(true, function () { persist(); fadeTo(title); }); }, 'sbtn', [860, 929, 300, 62]));
    s.appendChild(metalButton('恢复默认', function () { draft = { master: 80, bgm: 72, sfx: 86, full: false, fs: 32, bright: 100, ui: 1, calm: false }; preview(false); applyBright(100); draw(); }, 'sbtn', [1195, 929, 205, 62]));
    s.appendChild(metalButton('确认', function () {
      leave(true, backFn);
    }, 'sbtn', [1427, 929, 223, 62]));
  }

  /* ---------- 键盘与启动 ---------- */
  addEventListener('keydown', function (e) {
    if (!stage.querySelector('.hud') || S.tb) return;
    if (e.key === 'g' || e.key === 'G') toggleGlasses();
    if (e.key === 'Escape' && S.stack.length) back();
  });
  function exitCloseups(read) {
    var cb = read && S.tb && S.tb.cb;
    S.stack = []; S.hold = false; game();
    if (cb) cb();
  }
  window.__game = { say: say, S: S, Q: Q, start: game, submit: submit, title: title, toggle: toggleGlasses, push: push, camera: camera, select: selectPage, settings: settingsPage, album: albumPanel, log: logPanel, subm: submitPanel, ending: ending, loadQuest: loadQuest, register: register, intro: intro, letter: letter };
  P.supply = P.supply || supplyState(P);
  loadQuest(QID);
  var q = /skip=1/.test(location.search);
  if (q && QID === 'training' && !S.trainingStep) beginTraining();
  else if (q) game();
  else title();
})();

<script>
/* PWA：仅在独立网页（GitHub Pages）顶层启用；itch.io 的 iframe 内不注册 */
(function(){try{
  if(!('serviceWorker' in navigator)||window.top!==window) return;
  if(!(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')) return;
  var ASSET_CACHE='xzssy-assets-v1';
  addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){
      if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){});
      /* 后台补齐离线包：逐个下载尚未缓存的素材，可中断、下次打开继续 */
      var list=['./','index.html','manifest.webmanifest'].concat(Array.from(document.querySelectorAll('[data-src]'),function(n){return n.dataset.src;}));
      caches.open(ASSET_CACHE).then(function(c){
        var i=0;
        function next(){
          if(i>=list.length){
            try{localStorage.setItem('xzssy-offline','1')}catch(e){}
            /* 清理新版不再使用的旧素材 */
            var keep={};list.forEach(function(u){keep[new URL(u,location.href).href]=1;});
            c.keys().then(function(ks){ks.forEach(function(k){var p=new URL(k.url).pathname;if(/\/a\/[^\/]+$/.test(p)&&!keep[k.url.split('?')[0]]) c.delete(k);});});
            return;
          }
          var u=list[i++];
          c.match(u,{ignoreSearch:true}).then(function(hit){
            if(hit&&u!=='./'&&u!=='index.html') return;
            return fetch(u,{cache:'no-cache'}).then(function(r){if(r.ok&&r.status===200) return c.put(u,r);});
          }).catch(function(){}).then(function(){setTimeout(next,0);});
        }
        next();
      });
    }).catch(function(){});
  });
}catch(e){}})();
</script>
